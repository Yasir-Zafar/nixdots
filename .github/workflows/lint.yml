name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: statix
        run: nix run nixpkgs#statix -- check .

      - name: deadnix
        # hardware-configuration.nix is generated by nixos-generate-config
        run: nix run nixpkgs#deadnix -- --fail --exclude nix/hardware/hardware-configuration.nix .

      - name: alejandra
        run: nix run nixpkgs#alejandra -- --check --quiet nix hm dotfiles
