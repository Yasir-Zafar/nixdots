# statix: which files to skip.
# hardware-configuration.nix is generated; the nixvim files are annotated kickstart
# docs, and emacs.nix is a disabled module, so their layout is kept as is.
ignore = [
  "modules/home/nixvim",
  "modules/home/development/editors/emacs.nix",
  "hosts/mntbnd/hardware-configuration.nix",
]
