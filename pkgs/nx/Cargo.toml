[package]
name = "nx"
version = "0.2.0"
edition = "2024"
description = "Update management for ~/dots: rebuilds through nh, reports, and a TUI"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3"
libc = "0.2"
ratatui = "0.30"
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
